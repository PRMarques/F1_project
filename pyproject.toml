[project]
name = "f1-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Paulo Renato",email = "prenato1975@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pandas (>=2.1.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastparquet (>=2026.5.0,<2027.0.0)",
    "streamlit (>=1.60.0,<2.0.0)",
    "altair (>=6.2.2,<7.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "fastf1 (>=3.8.3,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]

[tool.poetry]
packages = [{include = "f1_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.1,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.taskipy.tasks]
docs = "mkdocs serve"
docs-build = "mkdocs build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "S", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=f1_project --cov-report=term-missing --cov-fail-under=50 -m \"not integration\""
markers = [
    "integration: testes que dependem da API OpenF1 real (não roda por padrão)",
]

[tool.coverage.run]
branch = true
source = ["f1_project"]
